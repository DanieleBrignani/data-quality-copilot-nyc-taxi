[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqc"
version = "0.1.0"
description = "Data Quality Copilot for NYC TLC trip records"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.30",
  "pyarrow>=16",
  "numpy>=2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
orchestration = ["prefect>=3"]
dbt = ["dbt-core>=1.8", "dbt-postgres>=1.8"]
soda = ["soda-core-postgres>=3.3", "setuptools"]  # setuptools provides distutils on py>=3.12
dashboard = ["streamlit>=1.40", "pandas>=2"]
copilot = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
dqc = "dqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires a running PostgreSQL (DQC_PG_DSN)"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]
