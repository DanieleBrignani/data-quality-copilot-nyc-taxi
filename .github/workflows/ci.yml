name: ci

on:
  push:
  pull_request:

jobs:
  unit-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src api tests
      - name: Unit tests (no database)
        env: {DQC_SKIP_DB: "1"}
        run: pytest -q
      - name: Quality gate — committed REAL sample vs baseline
        # fails when a change moves the quality score by more than the tolerated drop / rise
        run: python -m dqc gate

  integration:
    runs-on: ubuntu-latest
    needs: unit-and-gate
    services:
      postgres:
        image: postgres:16
        # throwaway credentials for an ephemeral service container that exists only for this job
        env: {POSTGRES_USER: dqc, POSTGRES_PASSWORD: ci-ephemeral, POSTGRES_DB: dqc}
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U dqc" --health-interval 5s --health-retries 20
    env:
      DQC_PG_HOST: localhost
      DQC_PG_PORT: "5433"
      DQC_PG_USER: dqc
      DQC_PG_PASSWORD: ci-ephemeral
      DQC_COPILOT_PASSWORD: ci-ephemeral-copilot
      DQC_READER_PASSWORD: ci-ephemeral-reader
      DQC_API_KEY: ci-ephemeral-key
      DQC_PG_DB: dqc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev,dbt,soda]"
      - run: python -m dqc init-db
      - name: Ingest one real TLC month (official source, hash-registered)
        run: python -m dqc ingest 2025-01
      - name: DB integration tests (idempotency, duplicate ingestion, quarantine, schema break)
        run: pytest -q -m db
      - name: Pipeline on real data
        run: python -m dqc run --partitions yellow_2025-01
      - name: dbt build (models + tests, incl. no-silent-loss reconciliation)
        working-directory: dbt
        run: dbt build --profiles-dir .
      - name: Soda contract on curated layer
        working-directory: soda
        run: soda scan -d dqc -c configuration.yml checks_clean_trips.yml
      - name: Soda SLO checks (a finding about the data, not a build failure)
        working-directory: soda
        continue-on-error: true
        run: soda scan -d dqc -c configuration.yml checks_slo.yml
      - name: SLO gate on warehouse results
        run: python -m dqc gate --slo
      - name: Failure demo (controlled fixtures must all be detected)
        run: python -m dqc demo-failures
