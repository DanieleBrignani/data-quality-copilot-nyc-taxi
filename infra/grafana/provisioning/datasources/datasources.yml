apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: QualityWarehouse
    uid: dqc_pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: dqc_reader
    secureJsonData:
      password: reader
    jsonData:
      database: dqc
      sslmode: disable
      postgresVersion: 1600
